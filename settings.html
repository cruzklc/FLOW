<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLOW — Settings</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ============ SETTINGS PAGE STYLES ============ */
    .settings-main {
      position: relative;
      z-index: 1;
      margin-left: var(--sidebar-width);
      padding: calc(var(--topbar-height) + 40px) 40px 80px;
      min-height: 100vh;
    }

    .settings-header {
      margin-bottom: 40px;
    }
    .settings-header h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: -0.3px;
    }
    .settings-header p {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0;
    }

    .settings-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 32px;
      max-width: 640px;
      margin-bottom: 24px;
    }

    .settings-section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .settings-section-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0 0 24px;
    }

    /* Theme grid */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .theme-swatch {
      position: relative;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 16px 12px 14px;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
      background: var(--surface-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      user-select: none;
    }
    .theme-swatch:hover {
      border-color: rgb(var(--swatch-primary-rgb, var(--primary-rgb)) / 0.6);
      transform: translateY(-2px);
    }
    .theme-swatch.active {
      border-color: var(--swatch-primary);
      box-shadow: 0 0 0 1px var(--swatch-primary), 0 0 20px rgb(var(--swatch-primary-rgb) / 0.25);
    }

    .theme-swatch-preview {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .theme-swatch-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .theme-swatch-check {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--swatch-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .theme-swatch.active .theme-swatch-check {
      opacity: 1;
      transform: scale(1);
    }

    @media (max-width: 900px) {
      .settings-main { margin-left: 0; padding: calc(var(--topbar-height) + 24px) 16px 100px; }
      .settings-section { padding: 20px 18px; }
      .theme-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 400px) {
      .theme-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- ============ MAIN CONTENT ============ -->
  <main class="settings-main">
    <div class="settings-header">
      <h1>Settings</h1>
      <p>Customize your FLOW experience</p>
    </div>

    <!-- Appearance section -->
    <div class="settings-section">
      <h2 class="settings-section-title">Appearance</h2>
      <p class="settings-section-sub">Choose your color theme</p>
      <div class="theme-grid" id="themeGrid"></div>
    </div>
  </main>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script>
    // Apply stored theme immediately to avoid flash
    (function() {
      const stored = localStorage.getItem("flow_theme");
      const themes = {
        violet:   { primary: "#7C3AED", primaryRgb: "124 58 237", primaryDark: "#5B21B6", secondary: "#06B6D4", secondaryRgb: "6 182 212" },
        ocean:    { primary: "#0EA5E9", primaryRgb: "14 165 233",  primaryDark: "#0369A1", secondary: "#14B8A6", secondaryRgb: "20 184 166" },
        sunset:   { primary: "#F97316", primaryRgb: "249 115 22",  primaryDark: "#C2410C", secondary: "#EC4899", secondaryRgb: "236 72 153" },
        forest:   { primary: "#10B981", primaryRgb: "16 185 129",  primaryDark: "#047857", secondary: "#84CC16", secondaryRgb: "132 204 22" },
        midnight: { primary: "#6366F1", primaryRgb: "99 102 241",  primaryDark: "#4338CA", secondary: "#8B5CF6", secondaryRgb: "139 92 246" },
        crimson:  { primary: "#EF4444", primaryRgb: "239 68 68",   primaryDark: "#B91C1C", secondary: "#F59E0B", secondaryRgb: "245 158 11" },
      };
      const t = themes[stored] || themes.violet;
      const r = document.documentElement;
      r.style.setProperty("--primary", t.primary);
      r.style.setProperty("--primary-rgb", t.primaryRgb);
      r.style.setProperty("--primary-dark", t.primaryDark);
      r.style.setProperty("--secondary", t.secondary);
      r.style.setProperty("--secondary-rgb", t.secondaryRgb);
    })();
  </script>
  <script src="theme.js"></script>
  <script src="identity.js"></script>
  <script>
    // Sidebar toggle
    const sidebarToggle = document.getElementById("sidebarToggle");
    const sidebar = document.getElementById("sidebar");
    if (sidebarToggle) {
      sidebarToggle.addEventListener("click", () => sidebar.classList.toggle("open"));
      document.addEventListener("click", (e) => {
        if (sidebar.classList.contains("open") && !sidebar.contains(e.target) && !sidebarToggle.contains(e.target)) {
          sidebar.classList.remove("open");
        }
      });
    }

    // Toast helper
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("visible");
      setTimeout(() => t.classList.remove("visible"), 2200);
    }

    // Build theme grid
    const THEMES_ORDER = ["violet", "ocean", "sunset", "forest", "midnight", "crimson"];
    const THEME_META = {
      violet:   { label: "Violet",   p: "#7C3AED", pRgb: "124 58 237", s: "#06B6D4" },
      ocean:    { label: "Ocean",    p: "#0EA5E9", pRgb: "14 165 233",  s: "#14B8A6" },
      sunset:   { label: "Sunset",   p: "#F97316", pRgb: "249 115 22",  s: "#EC4899" },
      forest:   { label: "Forest",   p: "#10B981", pRgb: "16 185 129",  s: "#84CC16" },
      midnight: { label: "Midnight", p: "#6366F1", pRgb: "99 102 241",  s: "#8B5CF6" },
      crimson:  { label: "Crimson",  p: "#EF4444", pRgb: "239 68 68",   s: "#DC2626" },
    };

    function buildThemeGrid(activeTheme) {
      const grid = document.getElementById("themeGrid");
      grid.innerHTML = "";
      THEMES_ORDER.forEach((key) => {
        const meta = THEME_META[key];
        const card = document.createElement("div");
        card.className = "theme-swatch" + (key === activeTheme ? " active" : "");
        card.style.setProperty("--swatch-primary", meta.p);
        card.style.setProperty("--swatch-primary-rgb", meta.pRgb);
        card.dataset.theme = key;

        card.innerHTML = `
          <svg class="theme-swatch-preview" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="grad-${key}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:${meta.p}"/>
                <stop offset="100%" style="stop-color:${meta.s}"/>
              </linearGradient>
            </defs>
            <circle cx="26" cy="26" r="26" fill="url(#grad-${key})"/>
          </svg>
          <span class="theme-swatch-name">${meta.label}</span>
          <div class="theme-swatch-check">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        `;

        card.addEventListener("click", () => {
          const session = getSession();
          if (!session) return;
          // Update active state in UI
          grid.querySelectorAll(".theme-swatch").forEach(c => c.classList.remove("active"));
          card.classList.add("active");
          // Save and apply
          saveUserTheme(session.id, key);
          showToast("Theme updated");
        });

        grid.appendChild(card);
      });
    }

    function init() {
      const session = getSession();
      const currentTheme = localStorage.getItem("flow_theme") || "violet";
      buildThemeGrid(currentTheme);
    }

    document.addEventListener("DOMContentLoaded", () => {
      applyStoredTheme();
      initIdentity(init);
    });
  </script>
</body>
